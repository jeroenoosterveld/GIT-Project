name: Deploy Memory Game to GitHub Pages

on:
  push:
    branches:
      - master
      - cursor/**
    paths:
      - 'memory-game/**'
      - '.github/workflows/deploy-memory-game.yml'

permissions:
  contents: write

concurrency:
  group: pages-memory-game
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memory-game/package-lock.json

      - name: Install dependencies
        working-directory: memory-game
        run: npm ci

      - name: Build and deploy with cache busting
        working-directory: memory-game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run deploy:pages
