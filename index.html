<!DOCTYPE html>
<html lang="nl">
  <head>
    <script>
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
        }
      })();
    </script>

    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

  <meta name="theme-color" content="#5b6cff">
<meta name="description" content="Offline memory spelletje">
<link rel="icon" href="/Memory-game/favicon.ico?v=2026-07-06-082248-fdb8461" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-version" content="2026-07-06-082248-fdb8461" />
    <link rel="manifest" href="/Memory-game/manifest.webmanifest?v=2026-07-06-082248-fdb8461" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Memory" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4d5fd6" />
    <link rel="apple-touch-icon" href="/Memory-game/assets/icon.png?v=2026-07-06-082248-fdb8461" />
    <style>
      html, body {
        margin: 0;
        background-color: #4d5fd6 !important;
        min-height: 100%;
        min-height: -webkit-fill-available;
        height: 100%;
        overflow: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
        height: 100%;
        background-color: #4d5fd6;
        display: flex !important;
        flex-direction: column;
        flex: 1;
      }
      .boot-message {
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        padding: 48px 24px;
        font-size: 18px;
        line-height: 1.5;
      }
      .boot-message a {
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><p class="boot-message">Memory laden…<br/><small>versie 2026-07-06-082248-fdb8461</small></p></div>
    <script>
      (function () {
        var base = '/Memory-game';
        var root = document.getElementById('root');

        function showMessage(html) {
          if (root) {
            root.innerHTML = '<p class="boot-message">' + html + '</p>';
          }
        }

        function loadBundle(entry) {
          var script = document.createElement('script');
          script.src = entry.js + '?v=' + encodeURIComponent(entry.version) + '&_=' + Date.now();
          script.defer = true;
          script.onerror = function () {
            var retryUrl = base + '/?v=' + encodeURIComponent(entry.version) + '&_=' + Date.now();
            showMessage(
              'App laden mislukt.<br/><br/>' +
              '<a href="' + retryUrl + '" style="color:#ffffff;font-weight:700">Opnieuw proberen</a>'
            );
          };
          document.body.appendChild(script);
        }

        fetch(base + '/entry.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('entry');
            }
            return response.json();
          })
          .then(loadBundle)
          .catch(function () {
            showMessage(
              'Kan de nieuwste versie niet laden.<br/><br/>' +
              '<a href="' + base + '/" style="color:#ffffff;font-weight:700">Open Memory opnieuw</a>'
            );
          });
      })();
    </script>

</body>
</html>
